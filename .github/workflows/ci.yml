name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: ensure build output committed
        run: git diff --exit-code data/
  classify:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: classify changed paths for wrangler deploy
        id: decision
        env:
          DEPLOY_BEFORE: ${{ github.event.before }}
          DEPLOY_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/deploy-decision.mjs
      - name: fail closed when deploy classification is missing
        if: steps.decision.outputs.deploy != 'true' && steps.decision.outputs.deploy != 'false'
        run: |
          echo "::error::배포 여부를 판정하지 못했습니다."
          exit 1
  deploy:
    needs: [validate, classify]
    if: needs.validate.result == 'success' && needs.classify.result == 'success' && needs.classify.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: deploy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api
          wranglerVersion: "4.111.0"
          command: deploy --var GIT_SHA:${{ github.sha }}
