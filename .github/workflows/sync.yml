# 매주 월요일 오후 KENCIS 인증 수집을 시도한다. 한 슬롯이 성공하면 이후 슬롯은
# 건너뛰고, 앞선 슬롯의 API 장애는 마지막 슬롯까지 복구 기회를 남긴다.
name: sync-kencis

on:
  schedule:
    - cron: '17 4 * * 1' # 매주 월요일 13:17 KST
    - cron: '17 7 * * 1' # 매주 월요일 16:17 KST
    - cron: '17 10 * * 1' # 매주 월요일 19:17 KST (최종 시도)
  workflow_dispatch:

concurrency:
  group: sync-kencis
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      fetch-succeeded: ${{ steps.fetch.outputs.succeeded }}
      candidate-count: ${{ steps.candidates.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: check earlier successful sync slot
        id: recovery
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('should-run', 'true');
              return;
            }

            const { pathToFileURL } = require('node:url');
            const recovery = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/sync-recovery.mjs`,
            ).href);

            try {
              const current = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              const recoveryDate = recovery.kstDate(current.data.created_at);
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sync.yml',
                status: 'completed',
                per_page: 100,
              });

              for (const run of runs) {
                if (!recovery.isPriorSyncCandidate(run, context.runId, recoveryDate)) continue;

                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100,
                });
                if (!recovery.hasValidatedSync(jobs)) continue;

                core.setOutput('should-run', 'false');
                core.notice(`오늘 동기화가 이미 성공해 이 복구 슬롯을 건너뜁니다: ${run.html_url}`);
                await core.summary
                  .addHeading('KENCIS 동기화 생략')
                  .addRaw(`오늘 성공한 [이전 실행 #${run.run_number}](${run.html_url})이 있어 중복 수집을 건너뜁니다.`)
                  .write();
                return;
              }
            } catch (error) {
              core.warning(`이전 실행 확인 실패; 동기화를 계속합니다: ${error.message}`);
            }

            core.setOutput('should-run', 'true');
      - uses: actions/setup-node@v7
        if: steps.recovery.outputs.should-run == 'true'
        with:
          node-version: 22
      - name: preserve previous review list
        if: steps.recovery.outputs.should-run == 'true'
        run: cp data/unmapped.json "$RUNNER_TEMP/unmapped-before.json"
      - name: fetch KENCIS with short retries
        if: steps.recovery.outputs.should-run == 'true'
        id: fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FINAL_SCHEDULE: '17 10 * * 1'
        run: |
          if node scripts/fetch-kencis.mjs; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            status=$?
          fi

          echo "succeeded=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" != "$FINAL_SCHEDULE" ]]; then
            echo "::warning::KENCIS API 연결 실패; 다음 복구 슬롯에서 다시 시도합니다."
            {
              echo '## KENCIS 동기화 연기'
              echo
              echo "- 예약: \`$SCHEDULE\`"
              echo '- 결과: 공공데이터 API 연결 실패'
              echo '- 조치: 이번 실행의 빌드·AI·PR 생성을 건너뛰고 다음 복구 슬롯에서 재시도'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::KENCIS API 연결이 최종 시도까지 실패했습니다."
          exit "$status"
      - name: build and validate raw sync
        if: steps.fetch.outputs.succeeded == 'true'
        run: npm run check
      - name: find new or changed unmapped and ambiguous names
        if: steps.fetch.outputs.succeeded == 'true'
        id: candidates
        run: |
          count=$(node scripts/find-new-unmapped.mjs \
            "$RUNNER_TEMP/unmapped-before.json" \
            data/unmapped.json \
            sync-candidates.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "New review candidates: $count"
      - name: upload raw sync
        if: steps.fetch.outputs.succeeded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: raw-sync
          retention-days: 1
          if-no-files-found: error
          path: |
            data/raw/kencis-import.json
            data/raw/kencis-domestic.json
            data/models.json
            data/models.lite.json
            data/models.min.json
            data/unmapped.json
            mapping/models.json
      - name: upload AI candidates
        if: steps.fetch.outputs.succeeded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sync-candidates
          retention-days: 1
          if-no-files-found: error
          path: sync-candidates.json

  enrich:
    needs: prepare
    if: needs.prepare.outputs.fetch-succeeded == 'true' && needs.prepare.outputs.candidate-count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proposal: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: raw-sync
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: sync-candidates
          path: .
      # 보안 경계: 이 잡은 쓰기 토큰이 없고 Codex도 read-only다. 반드시 마지막 단계로 둔다.
      - name: research mapping proposals
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/enrich-kencis.md
          output-schema-file: .github/codex/schemas/enrichment.schema.json
          sandbox: read-only
          codex-args: '["--search", "--ephemeral"]'
          effort: high
          allow-bots: true

  publish:
    needs: [prepare, enrich]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.fetch-succeeded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request-number: ${{ steps.pr.outputs.pull-request-number }}
      pull-request-url: ${{ steps.pr.outputs.pull-request-url }}
      pull-request-head-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: preserve base data for PR summary
        run: |
          mkdir -p \
            "$RUNNER_TEMP/sync-base/data/raw" \
            "$RUNNER_TEMP/sync-base/data" \
            "$RUNNER_TEMP/sync-base/mapping"
          cp data/raw/kencis-import.json "$RUNNER_TEMP/sync-base/data/raw/kencis-import.json"
          cp data/raw/kencis-domestic.json "$RUNNER_TEMP/sync-base/data/raw/kencis-domestic.json"
          cp data/models.json "$RUNNER_TEMP/sync-base/data/models.json"
          cp data/unmapped.json "$RUNNER_TEMP/sync-base/data/unmapped.json"
          cp mapping/models.json "$RUNNER_TEMP/sync-base/mapping/models.json"
      - uses: actions/download-artifact@v8
        with:
          name: raw-sync
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: sync-candidates
          path: .
      - name: apply validated AI proposal with raw-sync fallback
        id: apply
        env:
          AI_PROPOSAL: ${{ needs.enrich.outputs.proposal }}
          CANDIDATE_COUNT: ${{ needs.prepare.outputs.candidate-count }}
        run: |
          cp mapping/models.json "$RUNNER_TEMP/models-before-ai.json"
          status=not-needed

          if [[ "$CANDIDATE_COUNT" != "0" ]]; then
            if [[ -n "$AI_PROPOSAL" ]]; then
              AI_PROPOSAL_PATH="$RUNNER_TEMP/ai-proposal.json" \
                node -e 'require("node:fs").writeFileSync(process.env.AI_PROPOSAL_PATH, process.env.AI_PROPOSAL)'
              if node scripts/apply-ai-mappings.mjs \
                sync-candidates.json \
                "$RUNNER_TEMP/ai-proposal.json" \
                "$RUNNER_TEMP/ai-enrichment.md"; then
                status=applied
              else
                cp "$RUNNER_TEMP/models-before-ai.json" mapping/models.json
                status=fallback-invalid-proposal
              fi
            else
              status=fallback-ai-unavailable
            fi
          fi

          if ! npm run check; then
            if [[ "$status" == "applied" ]]; then
              echo "::warning::AI mapping failed repository checks; reverting to raw sync"
              cp "$RUNNER_TEMP/models-before-ai.json" mapping/models.json
              npm run check
              status=fallback-check-failed
              rm -f "$RUNNER_TEMP/ai-enrichment.md"
            else
              exit 1
            fi
          fi

          if [[ ! -s "$RUNNER_TEMP/ai-enrichment.md" ]]; then
            printf '%s\n' \
              '### AI 사전 보완' \
              '' \
              "- 결과: ${status}" \
              "- 신규 검토 후보: ${CANDIDATE_COUNT}건" \
              > "$RUNNER_TEMP/ai-enrichment.md"
          fi

          rm -f sync-candidates.json
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev \
            '^(mapping/models\.json|data/raw/kencis-(import|domestic)\.json|data/models(\.lite|\.min)?\.json|data/unmapped\.json)$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: summarize actual data changes
        run: |
          node scripts/summarize-sync.mjs \
            "$RUNNER_TEMP/sync-base" \
            . \
            "$RUNNER_TEMP/sync-summary.md"
      - name: compose pull request body
        env:
          AI_STATUS: ${{ steps.apply.outputs.status }}
        run: |
          {
            echo '주간 자동 수집으로 감지된 KENCIS 인증 데이터 변경입니다.'
            echo
            cat "$RUNNER_TEMP/sync-summary.md"
            echo
            cat "$RUNNER_TEMP/ai-enrichment.md"
            echo
            echo "자동 보완 상태: \`$AI_STATUS\`"
            echo
            echo 'PR 생성 후 별도의 읽기 전용 AI 검증이 실제 HEAD를 다시 확인하고 상태 코멘트를 남깁니다.'
          } > "$RUNNER_TEMP/pr-body.md"
      - name: create or update sync PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: sync/kencis
          delete-branch: true
          title: 'sync: 신규 KENCIS 인증 반영'
          commit-message: |
            sync: refresh KENCIS certification data

            Co-authored-by: Codex <noreply@openai.com>
          author: 'starhn87 <36434219+starhn87@users.noreply.github.com>'
          committer: 'starhn87 <36434219+starhn87@users.noreply.github.com>'
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            mapping/models.json
            data/raw/kencis-import.json
            data/raw/kencis-domestic.json
            data/models.json
            data/models.lite.json
            data/models.min.json
            data/unmapped.json

  review:
    needs: publish
    if: needs.publish.outputs.pull-request-number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.pull-request-head-sha }}
          fetch-depth: 0
          persist-credentials: false
      # 보안 경계: 생성된 PR HEAD를 읽기만 하며 이 잡은 쓰기 토큰이 없다. 반드시 마지막 단계로 둔다.
      - name: independently review sync PR
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-kencis.md
          output-schema-file: .github/codex/schemas/review.schema.json
          sandbox: read-only
          codex-args: '["--search", "--ephemeral"]'
          effort: medium
          allow-bots: true

  comment:
    needs: [publish, review]
    if: always() && needs.publish.outputs.pull-request-number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: create or update AI verdict comment
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.publish.outputs.pull-request-number }}
          REVIEW_JSON: ${{ needs.review.outputs.result }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
        with:
          script: |
            const marker = '<!-- codex-kencis-sync-review -->';
            const number = Number(process.env.PR_NUMBER);
            let body;

            try {
              if (process.env.REVIEW_JOB_RESULT !== 'success' || !process.env.REVIEW_JSON) {
                throw new Error('AI review job did not return a result');
              }
              const review = JSON.parse(process.env.REVIEW_JSON);
              const ready = review.verdict === 'ready';
              const findings = review.findings.length
                ? review.findings.map((item) => `- **${item.severity} · ${item.title}** — ${item.detail}`).join('\n')
                : '- 조치가 필요한 발견 사항 없음';
              const checks = review.checks.length
                ? review.checks.map((item) => `- ${item}`).join('\n')
                : '- 기록된 검증 없음';
              body = `${marker}\n## ${ready ? '✅ AI 검증: 이대로 머지 가능' : '⚠️ AI 검증: 추가 조치 필요'}\n\n${review.summary}\n\n### 발견 사항\n\n${findings}\n\n### 확인 내용\n\n${checks}`;
            } catch (error) {
              body = `${marker}\n## ⚠️ AI 검증을 완료하지 못함\n\n자동 검증 결과를 만들지 못했습니다. 이 PR은 수동 확인 후 머지해 주세요.\n\n- 사유: ${error.message}`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }
